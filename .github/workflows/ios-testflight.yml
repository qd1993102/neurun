name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect after the signed export
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/ios-ci.yml

  distribute:
    name: Sign and export iOS build
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    environment: testflight
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Archive, export and optionally upload
        env:
          IOS_UPLOAD: ${{ inputs.upload }}
          IOS_RELEASE_BUNDLE_ID: ${{ vars.IOS_RELEASE_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: bash ci/ios/testflight.sh
      - name: Retain release record and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-release-record
          retention-days: 90
          if-no-files-found: error
