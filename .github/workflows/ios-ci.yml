name: iOS CI

on:
  pull_request:
    paths:
      - apps/ios/**
      - ci/ios/**
      - .xcode-version
      - Makefile
      - .github/workflows/ios-*.yml
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - ci/ios/**
      - .xcode-version
      - Makefile
      - .github/workflows/ios-*.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-and-archive:
    name: iOS simulator and archive
    # The arm64 image stalled in the iOS 26.5 CoreLocation data migration.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set build output directory
        run: echo "IOS_OUTPUT_DIR=$RUNNER_TEMP/ios-checks" >> "$GITHUB_ENV"
      - name: Check Xcode and simulator
        run: make ios-doctor
      - name: Archive Release build for iPhone
        run: make ios-archive
      - name: Boot the iPhone simulator
        timeout-minutes: 6
        run: bash ci/ios/check.sh boot
      - name: Launch smoke test on iPhone simulator
        timeout-minutes: 10
        run: make ios-test
      - name: Retain results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_OUTPUT_DIR }}/*/*.xcresult
            ${{ env.IOS_OUTPUT_DIR }}/*/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
